spring.application.name=cafe-management-system

# ---------- Database ----------
# Reads from environment variables when set (deployment), falls back to
# localhost defaults for local dev so nothing breaks on your machine.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cafe_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:yourpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- Redis ----------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ---------- JWT ----------
# 256-bit base64 secret. MUST be overridden via JWT_SECRET env var in
# production - never deploy with the default value below.
app.jwt.secret=${JWT_SECRET:ZmFrZS1zZWNyZXQtcmVwbGFjZS10aGlzLXdpdGgtYS1yZWFsLTI1Ni1iaXQta2V5LWJlZm9yZS1wcm9k}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- CORS ----------
# Comma-separated list of allowed frontend origins. Add your deployed
# frontend URL here via env var once you know it (see SecurityConfig.java).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ---------- Server ----------
server.port=${PORT:8080}

# ---------- Logging ----------
logging.level.org.springframework.security=INFO
logging.level.com.cafe=DEBUG
